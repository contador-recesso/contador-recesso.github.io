  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    }

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

em; text-transform: uppercase; color: #7FD8FF;\">dias<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 12px 16px; border-radius: 18px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(8px); text-align: center;\">\n          <div style=\"font-family: 'Barlow Condensed', Archivo, sans-serif; font-weight: 700; font-size: clamp(52px, 9vw, 82px); line-height: 1; color: #fff; font-variant-numeric: tabular-nums;\">{{ horas }}<\u002Fdiv>\n          <div style=\"margin-top: 6px; font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: #7FD8FF;\">horas<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 12px 16px; border-radius: 18px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(8px); text-align: center;\">\n          <div style=\"font-family: 'Barlow Condensed', Archivo, sans-serif; font-weight: 700; font-size: clamp(52px, 9vw, 82px); line-height: 1; color: #fff; font-variant-numeric: tabular-nums;\">{{ minutos }}<\u002Fdiv>\n          <div style=\"margin-top: 6px; font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: #7FD8FF;\">minutos<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 12px 16px; border-radius: 18px; background: rgba(0,117,190,.5); border: 1px solid rgba(127,216,255,.55); backdrop-filter: blur(8px); text-align: center;\">\n          <div style=\"font-family: 'Barlow Condensed', Archivo, sans-serif; font-weight: 700; font-size: clamp(52px, 9vw, 82px); line-height: 1; color: #fff; font-variant-numeric: tabular-nums;\">{{ segundos }}<\u002Fdiv>\n          <div style=\"margin-top: 6px; font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: #FFD166;\">segundos<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ contando }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width: 100%; max-width: 720px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(8px); overflow: hidden;\">\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr;\">\n          <div style=\"padding: 18px 12px 14px; text-align: center; border-right: 1px solid rgba(255,255,255,.14);\">\n            <div style=\"font-family: 'Barlow Condensed', Archivo, sans-serif; font-weight: 700; font-size: clamp(40px, 6.4vw, 62px); line-height: 1; color: #FFD166; font-variant-numeric: tabular-nums;\">{{ horasTrabalho }}<\u002Fdiv>\n            <div style=\"margin-top: 6px; font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: rgba(234,246,255,.72);\">horas de trabalho<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 18px 12px 14px; text-align: center;\">\n            <div style=\"font-family: 'Barlow Condensed', Archivo, sans-serif; font-weight: 700; font-size: clamp(40px, 6.4vw, 62px); line-height: 1; color: #fff; font-variant-numeric: tabular-nums;\">{{ diasUteis }}<\u002Fdiv>\n            <div style=\"margin-top: 6px; font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: rgba(234,246,255,.72);\">dias úteis<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 10px 18px 12px; border-top: 1px solid rgba(255,255,255,.12); background: rgba(0,39,77,.28); font-size: 12.5px; line-height: 1.5; text-align: center; color: rgba(234,246,255,.66); text-wrap: pretty;\">\n          {{ horasDia }} h por dia · fora sábados, domingos e feriados nacionais, do Paraná e de Curitiba\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ acabou }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 28px 34px; border-radius: 22px; background: rgba(255,209,102,.14); border: 1px solid rgba(255,209,102,.5); text-align: center;\">\n        <div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(30px, 5vw, 56px); text-transform: uppercase; line-height: 1;\">Acabou!<\u002Fdiv>\n        <div style=\"margin-top: 10px; font-size: 18px; color: rgba(234,246,255,.85);\">Recesso liberado. Feliz Natal e um ótimo ano novo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;\">\n      <span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 999px; background: rgba(230,57,70,.16); border: 1px solid rgba(230,57,70,.55); font-size: 13px; font-weight: 500; letter-spacing: .04em; color: #ffd9dc;\">\n        <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #E63946; animation: blink 1.6s ease-in-out infinite;\"><\u002Fspan>\n        Data ainda não oficial\n      <\u002Fspan>\n      <span style=\"padding: 9px 15px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); font-size: 13px; color: rgba(234,246,255,.8);\">{{ recado }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position: absolute; left: 0; right: 0; bottom: 10px; z-index: 7; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;\">\n    <div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(13px, 1.6vw, 17px); letter-spacing: .2em; text-transform: uppercase; color: #00426e; text-shadow: 0 1px 0 rgba(255,255,255,.45);\">CREATING FÉRIAS THAT MATTERS<\u002Fdiv>\n    <div style=\"font-size: 12px; letter-spacing: .06em; color: rgba(0,66,110,.75);\">horário de Brasília · atualiza a cada segundo<\u002Fdiv>\n    <sc-if value=\"{{ egg }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 6px 13px; border-radius: 999px; background: rgba(217,119,87,.18); border: 1px solid rgba(217,119,87,.6); animation: bob 3s ease-in-out infinite;\">\n        <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 5px; background: #D97757; color: #fff; font-family: Archivo, sans-serif; font-weight: 800; font-size: 12px; line-height: 1;\">C<\u002Fspan>\n        <span style=\"font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #7a3418;\">Patrocinado pelo Claudio<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;targetIso&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-12-23T17:25:00-03:00&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contador&quot;},&quot;horasDia&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:8.5,&quot;min&quot;:4,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;h&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Contador&quot;},&quot;cicloTema&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:15,&quot;min&quot;:5,&quot;max&quot;:300,&quot;step&quot;:5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cena&quot;},&quot;fogos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Cena&quot;},&quot;luzes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Cena&quot;},&quot;intensidade&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.2,&quot;min&quot;:0.3,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cena&quot;}}\">\nconst PALETA = ['#FFD166', '#E63946', '#7FD8FF', '#ffffff', '#0075BE', '#9BE564'];\nconst R = (a, b) => a + Math.random() * (b - a);\n\nclass Component extends DCLogic {\n  state = { agora: Date.now(), egg: false, cliques: 0, dia: true };\n\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState({ agora: Date.now() }), 1000);\n\n    const ciclo = (Number(this.props.cicloTema) || 15) * 1000;\n    this.ciclo = setInterval(() => this.setState(s => ({ dia: !s.dia }), () => this.pintaTema()), ciclo);\n    setTimeout(() => this.pintaTema(), 60);\n    this.iniciarFogos();\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    clearTimeout(this.eggTimer);\n    clearInterval(this.ciclo);\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener('resize', this.onResize);\n  }\n\n  alvo() {\n    const t = new Date(this.props.targetIso || '2026-12-23T17:25:00-03:00').getTime();\n    return isNaN(t) ? new Date('2026-12-23T17:25:00-03:00').getTime() : t;\n  }\n\n  iniciarFogos() {\n    const canvas = this.fx && this.fx.current;\n    if (!canvas) { setTimeout(() => this.iniciarFogos(), 120); return; }\n    const ctx = canvas.getContext('2d');\n    let particulas = [], foguetes = [], proximo = 0;\n\n    this.onResize = () => {\n      const dpr = Math.min(window.devicePixelRatio || 1, 2);\n      canvas.width = canvas.clientWidth * dpr;\n      canvas.height = canvas.clientHeight * dpr;\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    };\n    this.onResize();\n    window.addEventListener('resize', this.onResize);\n\n    const explodir = (x, y, cor) => {\n      const n = Math.round(R(48, 78));\n      const forca = R(2.1, 4.2);\n      for (let i = 0; i < n; i++) {\n        const a = (i / n) * Math.PI * 2 + R(-0.05, 0.05);\n        const v = forca * R(0.55, 1);\n        particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: R(60, 105), t: 0, cor, r: R(1.2, 2.4) });\n      }\n    };\n\n    const lancar = () => {\n      const w = canvas.clientWidth, h = canvas.clientHeight;\n      foguetes.push({\n        x: R(w * 0.12, w * 0.88), y: h * 0.92,\n        vy: -R(7, 10.5), vx: R(-0.5, 0.5),\n        alvo: R(h * 0.12, h * 0.45), cor: PALETA[Math.floor(Math.random() * PALETA.length)]\n      });\n    };\n\n    this.boom = () => {\n      const w = canvas.clientWidth, h = canvas.clientHeight;\n      for (let i = 0; i < 4; i++) {\n        setTimeout(() => explodir(R(w * 0.2, w * 0.8), R(h * 0.15, h * 0.5), '#D97757'), i * 180);\n      }\n    };\n\n    const loop = (ts) => {\n      this.raf = requestAnimationFrame(loop);\n      const w = canvas.clientWidth, h = canvas.clientHeight;\n      ctx.globalCompositeOperation = 'destination-out';\n      ctx.fillStyle = 'rgba(0,0,0,0.16)';\n      ctx.fillRect(0, 0, w, h);\n      ctx.globalCompositeOperation = 'lighter';\n\n      const ligado = this.props.fogos !== false && !this.state.dia;\n      const intens = Number(this.props.intensidade) || 1.2;\n      const festa = this.restante() <= 0;\n      if (ligado && ts > proximo) {\n        lancar();\n        if (festa) { lancar(); lancar(); }\n        proximo = ts + R(700, 1900) / (intens * (festa ? 2.4 : 1));\n      }\n\n      for (let i = foguetes.length - 1; i >= 0; i--) {\n        const f = foguetes[i];\n        f.x += f.vx; f.y += f.vy; f.vy += 0.12;\n        ctx.beginPath();\n        ctx.fillStyle = f.cor;\n        ctx.arc(f.x, f.y, 2.1, 0, Math.PI * 2);\n        ctx.fill();\n        if (f.vy >= -0.6 || f.y <= f.alvo) { explodir(f.x, f.y, f.cor); foguetes.splice(i, 1); }\n      }\n\n      for (let i = particulas.length - 1; i >= 0; i--) {\n        const p = particulas[i];\n        p.t++; p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.vx *= 0.985; p.vy *= 0.985;\n        const alpha = Math.max(0, 1 - p.t / p.vida);\n        ctx.globalAlpha = alpha * alpha;\n        ctx.beginPath();\n        ctx.fillStyle = p.cor;\n        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.globalAlpha = 1;\n        if (p.t >= p.vida) particulas.splice(i, 1);\n      }\n      if (particulas.length > 2600) particulas.splice(0, particulas.length - 2600);\n    };\n    this.raf = requestAnimationFrame(loop);\n  }\n\n  pintaTema() {\n    const dia = this.state.dia;\n    document.querySelectorAll('[data-dia]').forEach(e => { e.style.opacity = dia ? '1' : '0'; });\n    document.querySelectorAll('[data-noite]').forEach(e => { e.style.opacity = dia ? '0' : '1'; });\n    document.querySelectorAll('[data-fogos]').forEach(e => { e.style.opacity = dia ? '.1' : '1'; });\n    const treno = document.querySelector('[data-treno]');\n    if (treno && !dia) { treno.style.animation = 'none'; void treno.offsetWidth; treno.style.animation = 'voo 26s linear infinite'; }\n  }\n\n  restante() { return this.alvo() - this.state.agora; }\n\n  // nacionais + Paraná (19/12) + Curitiba (08/09, Corpus Christi)\n  feriados(ano) {\n    const fixos = ['01-01','04-21','05-01','09-07','09-08','10-12','11-02','11-15','11-20','12-19','12-25'];\n    const pascoa = this.pascoa(ano);\n    const md = (d) => String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n    const desloca = (n) => { const d = new Date(pascoa); d.setDate(d.getDate() + n); return md(d); };\n    return fixos.concat([desloca(-48), desloca(-47), desloca(-2), desloca(60)]);\n  }\n\n  pascoa(ano) {\n    const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;\n    const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);\n    const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;\n    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;\n    const m = Math.floor((a + 11 * h + 22 * l) / 451);\n    const mes = Math.floor((h + l - 7 * m + 114) / 31);\n    const dia = ((h + l - 7 * m + 114) % 31) + 1;\n    return new Date(ano, mes - 1, dia);\n  }\n\n  jornada() {\n    const H = Number(this.props.horasDia) || 8.5;\n    const fim = new Date(this.alvo());\n    const agora = new Date(this.state.agora);\n    if (agora >= fim) return { horas: 0, dias: 0 };\n    const fer = this.feriados(fim.getFullYear());\n    const util = (d) => {\n      const s = d.getDay();\n      if (s === 0 || s === 6) return false;\n      const mmdd = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n      return !fer.includes(mmdd);\n    };\n    const mesmoDia = (a, b) => a.toDateString() === b.toDateString();\n    let horas = 0, dias = 0;\n    const d = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());\n    const ultimo = new Date(fim.getFullYear(), fim.getMonth(), fim.getDate());\n    while (d <= ultimo) {\n      if (util(d)) {\n        dias++;\n        if (mesmoDia(d, agora)) {\n          const saida = mesmoDia(d, fim) ? fim : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 17, 25);\n          const entrada = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0);\n          const ini = agora > entrada ? agora : entrada;\n          horas += Math.max(0, Math.min(H, (saida - ini) / 3600000));\n        } else if (mesmoDia(d, fim)) {\n          horas += Math.max(0, Math.min(H, (fim - new Date(fim.getFullYear(), fim.getMonth(), fim.getDate(), 8, 0)) / 3600000));\n        } else {\n          horas += H;\n        }\n      }\n      d.setDate(d.getDate() + 1);\n    }\n    return { horas, dias };\n  }\n\n  salva() {\n    try { localStorage.setItem('recesso-egg', '1'); } catch (e) {}\n    if (this.boom) this.boom();\n  }\n\n  frase(dias, horas) {\n    if (dias > 100) return 'Ainda dá tempo de aprender a fazer nó de rede.';\n    if (dias > 60) return 'Protetor solar ainda não é urgência. Ainda.';\n    if (dias > 30) return 'Um mês e pouco: já pode escolher a praia.';\n    if (dias > 14) return 'Duas semanas. Comece a esconder as tarefas novas.';\n    if (dias > 7) return 'Reta final. Cuidado com reunião marcada dia 18.';\n    if (dias > 1) return 'A mala já está pedindo para sair do armário.';\n    if (dias === 1) return 'Amanhã! Chinelo já separado.';\n    if (horas > 2) return 'Hoje é o dia. Segura o coração.';\n    if (horas >= 0) return 'Últimas horas. Ninguém abre e-mail novo agora.';\n    return 'Boas festas!';\n  }\n\n  renderVals() {\n    if (!this.fx) this.fx = React.createRef();\n    const ms = Math.max(0, this.restante());\n    const total = Math.floor(ms / 1000);\n    const dias = Math.floor(total / 86400);\n    const horas = Math.floor((total % 86400) / 3600);\n    const minutos = Math.floor((total % 3600) / 60);\n    const segundos = total % 60;\n    const p = (n) => String(n).padStart(2, '0');\n    const j = this.jornada();\n    return {\n      diaOp: this.state.dia ? '1' : '0',\n      noiteOp: this.state.dia ? '0' : '1',\n      fxOp: this.state.dia ? '.12' : '1',\n      horasTrabalho: j.horas.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }),\n      diasUteis: String(j.dias),\n      horasDia: String(Number(this.props.horasDia) || 8.5).replace('.', ','),\n      fxRef: this.fx,\n      luzes: this.props.luzes !== false,\n      fogos: this.props.fogos !== false,\n      contando: ms > 0,\n      acabou: ms <= 0,\n      dias: String(dias),\n      horas: p(horas),\n      minutos: p(minutos),\n      segundos: p(segundos),\n      recado: this.frase(dias, horas),\n      egg: this.state.egg,\n      abrirEgg: () => {\n        if (this.state.egg) return;\n        const c = this.state.cliques + 1;\n        if (c >= 3) {\n          if (this.boom) this.boom();\n          clearTimeout(this.eggTimer);\n          this.eggTimer = setTimeout(() => this.setState({ egg: false, cliques: 2 }), 6000);\n          this.setState({ cliques: c, egg: true });\n        } else {\n          this.setState({ cliques: c });\n        }\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
